# Included in every location (nginx drops server-level add_header when a location adds its own).
# HSTS only on HTTPS: the server block sets $nwrmp_hsts, and an empty value sends no header.
add_header Strict-Transport-Security $nwrmp_hsts always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The field app needs GPS and the camera on its own origin only.
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
