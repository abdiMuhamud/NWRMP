# The NWRMP site itself: the web app and the /api proxy. Included by the server block that
# serves users (templates/https: the 443 server; templates/http: the port-80 server).
# The including server sets $nwrmp_hsts (empty on plain HTTP, so no HSTS header is sent).

# Inspection photos are compressed on the phone; the API also limits each to 5 MB.
client_max_body_size 10m;

gzip on;
gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
gzip_min_length 1024;

root /usr/share/nginx/html;

# API (same origin, so the session cookie works). X-Forwarded-Proto tells the API whether the
# browser used HTTPS, which decides the cookie's Secure flag.
location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    set $api_upstream http://api:3001;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# Hashed build files never change: cache for a year.
location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# The service worker and manifest must always be re-checked so updates reach phones.
location ~ ^/(sw\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

# Single-page app: unknown paths load index.html.
location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}
