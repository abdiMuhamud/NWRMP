# NWRMP production stack for a single Linux server (tested target: Rocky Linux 9).
# Run from this folder:  docker compose up -d --build
# Settings come from deploy/.env (copy .env.example).

name: nwrmp

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: nwrmp
      POSTGRES_USER: nwrmp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      TZ: ${TZ:-Africa/Mogadishu}
    volumes:
      - db-data:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nwrmp -d nwrmp"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
    # No ports published: the database is reachable only from the API container.

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: nwrmp-api:${NWRMP_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://nwrmp:${POSTGRES_PASSWORD}@db:5432/nwrmp
      NODE_ENV: production
      PORT: "3001"
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      UPLOAD_DIR: /var/lib/nwrmp/uploads
      TZ: ${TZ:-Africa/Mogadishu}
    volumes:
      - uploads:/var/lib/nwrmp/uploads
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-}
    image: nwrmp-web:${NWRMP_VERSION:-latest}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Africa/Mogadishu}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # ",z" relabels the folders for SELinux (Rocky Linux runs SELinux in enforcing mode).
      - ./certs:/etc/nginx/certs:ro,z
      - ./certbot-www:/var/www/certbot:ro,z
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

volumes:
  db-data:
  uploads:
